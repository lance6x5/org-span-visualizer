name: Bug report
description: Something in Spanscope is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please **do not paste real employee data** (names, IDs, rosters). Use the sample CSV or made-up data to reproduce.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the sample CSV
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app footer, e.g. 1.1.0.
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 131 on Windows 11
  - type: textarea
    id: notes
    attributes:
      label: Screenshots / notes
      description: Drag images here. Blur or crop any personal data first.
